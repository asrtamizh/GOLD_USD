<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XAU/USD & USD Live Market Hub</title>
  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: #151924;
      --border-color: #2a2e3d;
      --text-main: #e1e3e6;
      --text-muted: #848e9c;
      --accent-gold: #f0b90b;
      --accent-green: #0ecb81;
      --accent-red: #f6465d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 20px;
      font-weight: 600;
      color: var(--accent-gold);
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--accent-green);
    }

    .pulse {
      width: 10px;
      height: 10px;
      background-color: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-green);
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .ticker-bar {
      border-bottom: 1px solid var(--border-color);
      height: 46px;
      background: var(--card-bg);
    }

    .container {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      padding: 20px;
      max-width: 1600px;
      margin: 0 auto;
      width: 100%;
      flex-grow: 1;
    }

    @media (max-width: 1024px) {
      .container { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 14px;
      color: var(--text-main);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chart-container {
      height: 500px;
      width: 100%;
    }

    .news-feed {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 800px;
      overflow-y: auto;
      padding-right: 6px;
    }

    .news-item {
      background: #1c202e;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 12px;
      transition: border-color 0.2s;
    }

    .news-item:hover {
      border-color: var(--accent-gold);
    }

    .news-item a {
      color: var(--text-main);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.4;
      display: block;
      margin-bottom: 6px;
    }

    .news-item a:hover {
      color: var(--accent-gold);
    }

    .news-meta {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
    }

    .tag {
      background: rgba(240, 185, 11, 0.15);
      color: var(--accent-gold);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }

    footer {
      border-top: 1px solid var(--border-color);
      padding: 12px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      background: var(--card-bg);
    }
  </style>
</head>
<body>

  <header>
    <h1>XAUUSD & USD Real-Time Hub</h1>
    <div class="live-badge">
      <div class="pulse"></div> Live Market Feed
    </div>
  </header>

  <!-- TradingView Ticker Tape Widget -->
  <div class="ticker-bar">
    <div class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
      {
        "symbols": [
          { "proName": "OANDA:XAUUSD", "title": "Gold / USD" },
          { "proName": "CAPITALCOM:DXY", "title": "US Dollar Index" },
          { "proName": "FX:EURUSD", "title": "EUR / USD" },
          { "proName": "FX:USDJPY", "title": "USD / JPY" }
        ],
        "showSymbolLogo": true,
        "isTransparent": true,
        "displayMode": "adaptive",
        "colorTheme": "dark",
        "locale": "en"
      }
      </script>
    </div>
  </div>

  <div class="container">
    <!-- Left Column: Interactive Chart -->
    <div class="card">
      <div class="card-title">
        <span>XAU/USD Live Advanced Chart</span>
      </div>
      <div class="chart-container" id="tv_chart"></div>
    </div>

    <!-- Right Column: Live Aggregated News Feed -->
    <div class="card">
      <div class="card-title">
        <span>Gold & USD Real-Time News</span>
        <button onclick="fetchNews()" style="background:none; border:none; color:var(--accent-gold); cursor:pointer; font-size:12px;">↻ Refresh</button>
      </div>
      <div class="news-feed" id="news-container">
        <div style="color: var(--text-muted); font-size: 13px;">Loading market updates...</div>
      </div>
    </div>
  </div>

  <footer>
    Market data powered by TradingView & Public RSS Feeds. Automatically updates client-side.
  </footer>

  <!-- TradingView Advanced Chart Script -->
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
  <script type="text/javascript">
    new TradingView.widget({
      "autosize": true,
      "symbol": "OANDA:XAUUSD",
      "interval": "60",
      "timezone": "Etc/UTC",
      "theme": "dark",
      "style": "1",
      "locale": "en",
      "toolbar_bg": "#f1f3f6",
      "enable_publishing": false,
      "allow_symbol_change": true,
      "container_id": "tv_chart"
    });

    // Client-side News Fetcher via rss2json API (No Backend Required)
    async function fetchNews() {
      const container = document.getElementById('news-container');
      const rssUrl = encodeURIComponent('https://www.fxstreet.com/rss/news');
      const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${rssUrl}`;

      try {
        const res = await fetch(apiUrl);
        const data = await res.json();
        
        if (data.status === 'ok') {
          container.innerHTML = '';
          // Filter items relevant to Gold, XAU, USD, Fed, Inflation, or Forex
          const items = data.items.filter(item => {
            const txt = (item.title + item.description).toLowerCase();
            return txt.includes('gold') || txt.includes('xau') || txt.includes('usd') || txt.includes('fed') || txt.includes('dollar');
          }).slice(0, 15);

          if(items.length === 0) {
            container.innerHTML = '<div style="color:var(--text-muted)">No recent XAU/USD news found. Retrying...</div>';
            return;
          }

          items.forEach(item => {
            const date = new Date(item.pubDate).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const newsCard = `
              <div class="news-item">
                <a href="${item.link}" target="_blank" rel="noopener noreferrer">${item.title}</a>
                <div class="news-meta">
                  <span class="tag">${item.author || 'Forex News'}</span>
                  <span>${date}</span>
                </div>
              </div>
            `;
            container.innerHTML += newsCard;
          });
        }
      } catch (err) {
        container.innerHTML = '<div style="color:var(--accent-red)">Unable to load live news feed. Please refresh.</div>';
      }
    }

    // Initial Fetch & Auto-Refresh every 60 seconds
    fetchNews();
    setInterval(fetchNews, 60000);
  </script>
</body>
</html>
