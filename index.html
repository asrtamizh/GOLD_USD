<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Retro Run & Gun - Contra Style</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a10;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      box-shadow: 0 0 20px rgba(0, 255, 200, 0.3);
      border: 4px solid #fff;
    }
    canvas {
      background: #111;
      display: block;
    }
    .instructions {
      margin-top: 12px;
      font-size: 14px;
      text-align: center;
      color: #aaa;
    }
    .key {
      background: #333;
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid #666;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="canvas" width="800" height="450"></canvas>
  </div>

  <div class="instructions">
    <p><span class="key">A</span> / <span class="key">D</span> = Move | <span class="key">W</span> / <span class="key">S</span> = Aim Up/Down | <span class="key">K</span> = Jump | <span class="key">J</span> = Shoot (Hold for Machine Gun)</p>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // Key Listener State
    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    // Global Game State
    let cameraX = 0;
    let score = 0;
    let gameOver = false;

    // Player Object
    const player = {
      x: 100,
      y: 200,
      w: 24,
      h: 44,
      vx: 0,
      vy: 0,
      speed: 3.5,
      jumpPower: -11,
      grounded: false,
      facing: 1, // 1 = Right, -1 = Left
      hp: 3,
      invulnerable: 0,
      weapon: 'NORMAL', // NORMAL, SPREAD, MACHINE
      shootCooldown: 0,
      aimY: 0 // -1 Up, 0 Straight, 1 Down
    };

    // Level Platforms
    const platforms = [
      { x: 0, y: 380, w: 1200, h: 70 },
      { x: 300, y: 280, w: 180, h: 20 },
      { x: 600, y: 220, w: 200, h: 20 },
      { x: 900, y: 300, w: 250, h: 20 },
      { x: 1300, y: 380, w: 1000, h: 70 },
      { x: 1500, y: 260, w: 200, h: 20 }
    ];

    // Dynamic Lists
    const playerBullets = [];
    const enemyBullets = [];
    const enemies = [
      { x: 500, y: 340, w: 24, h: 40, hp: 2, shootTimer: 0 },
      { x: 700, y: 180, w: 24, h: 40, hp: 2, shootTimer: 0 },
      { x: 1000, y: 260, w: 24, h: 40, hp: 2, shootTimer: 0 },
      { x: 1600, y: 340, w: 24, h: 40, hp: 3, shootTimer: 0 }
    ];
    const pods = [
      { x: 400, y: 120, w: 30, h: 18, type: 'SPREAD', alive: true },
      { x: 1100, y: 100, w: 30, h: 18, type: 'MACHINE', alive: true }
    ];
    const powerups = [];
    const particles = [];

    // Particle FX
    function createExplosion(x, y, color = '#ff5500', count = 12) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x: x, y: y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          life: 20 + Math.random() * 10,
          color: color
        });
      }
    }

    // Shooting Handler
    function handlePlayerShooting() {
      if (player.shootCooldown > 0) {
        player.shootCooldown--;
        return;
      }

      if (keys['KeyJ']) {
        let dirX = player.facing;
        let dirY = 0;

        if (keys['KeyW']) dirY = -1;
        else if (keys['KeyS'] && !player.grounded) dirY = 1;

        if (keys['KeyW'] && !keys['KeyA'] && !keys['KeyD']) dirX = 0;

        const startX = player.x + player.w / 2;
        const startY = player.y + player.h / 2;

        if (player.weapon === 'SPREAD') {
          const angles = [-0.25, 0, 0.25];
          angles.forEach(angle => {
            const speed = 9;
            let vx = dirX * speed;
            let vy = dirY * speed;

            if (dirX === 0 && dirY !== 0) {
              vx = angle * speed;
              vy = dirY * speed;
            } else {
              vy += angle * speed;
            }

            playerBullets.push({ x: startX, y: startY, vx: vx, vy: vy, life: 60 });
          });
          player.shootCooldown = 14;
        } else if (player.weapon === 'MACHINE') {
          const speed = 10;
          let vx = (dirX === 0 && dirY !== 0) ? 0 : dirX * speed;
          let vy = dirY * speed;
          playerBullets.push({ x: startX, y: startY, vx: vx, vy: vy, life: 60 });
          player.shootCooldown = 6; // Fast rate of fire
        } else {
          // NORMAL WEAPON
          const speed = 8;
          let vx = (dirX === 0 && dirY !== 0) ? 0 : dirX * speed;
          let vy = dirY * speed;
          playerBullets.push({ x: startX, y: startY, vx: vx, vy: vy, life: 60 });
          player.shootCooldown = 12;
        }
      }
    }

    // Main Update Loop
    function update() {
      if (gameOver) return;

      // Player Aiming Direction
      if (keys['KeyW']) player.aimY = -1;
      else if (keys['KeyS']) player.aimY = 1;
      else player.aimY = 0;

      // Horizontal Movement
      if (keys['KeyA']) {
        player.vx = -player.speed;
        player.facing = -1;
      } else if (keys['KeyD']) {
        player.vx = player.speed;
        player.facing = 1;
      } else {
        player.vx = 0;
      }

      // Jump
      if (keys['KeyK'] && player.grounded) {
        player.vy = player.jumpPower;
        player.grounded = false;
      }

      // Gravity & Physics
      player.vy += 0.5; // Gravity
      player.x += player.vx;
      player.y += player.vy;

      // Platform Collisions
      player.grounded = false;
      platforms.forEach(p => {
        if (
          player.x + player.w > p.x &&
          player.x < p.x + p.w &&
          player.y + player.h >= p.y &&
          player.y + player.h <= p.y + p.h &&
          player.vy >= 0
        ) {
          player.y = p.y - player.h;
          player.vy = 0;
          player.grounded = true;
        }
      });

      // Camera Scrolling (Forward only lock)
      if (player.x - cameraX > 350) {
        cameraX = player.x - 350;
      }

      // Handle Weapons Shooting
      handlePlayerShooting();

      // Invulnerability Decay
      if (player.invulnerable > 0) player.invulnerable--;

      // Update Player Bullets
      for (let i = playerBullets.length - 1; i >= 0; i--) {
        const b = playerBullets[i];
        b.x += b.vx;
        b.y += b.vy;
        b.life--;

        if (b.life <= 0) {
          playerBullets.splice(i, 1);
          continue;
        }

        // Hit Pods
        pods.forEach(pod => {
          if (pod.alive && b.x > pod.x && b.x < pod.x + pod.w && b.y > pod.y && b.y < pod.y + pod.h) {
            pod.alive = false;
            createExplosion(pod.x + pod.w / 2, pod.y + pod.h / 2, '#00ffff');
            powerups.push({ x: pod.x, y: pod.y, vy: -2, type: pod.type });
            playerBullets.splice(i, 1);
          }
        });

        // Hit Enemies
        enemies.forEach(e => {
          if (e.hp > 0 && b.x > e.x && b.x < e.x + e.w && b.y > e.y && b.y < e.y + e.h) {
            e.hp--;
            createExplosion(b.x, b.y, '#ffaa00', 5);
            playerBullets.splice(i, 1);
            if (e.hp <= 0) {
              createExplosion(e.x + e.w / 2, e.y + e.h / 2, '#ff2200', 15);
              score += 100;
            }
          }
        });
      }

      // Update Powerups Pickup
      for (let i = powerups.length - 1; i >= 0; i--) {
        const p = powerups[i];
        p.vy += 0.2;
        p.y += p.vy;

        // Ground lock for powerups
        platforms.forEach(plat => {
          if (p.x > plat.x && p.x < plat.x + plat.w && p.y >= plat.y - 12) {
            p.y = plat.y - 12;
            p.vy = 0;
          }
        });

        // Player collision
        if (
          player.x < p.x + 20 &&
          player.x + player.w > p.x &&
          player.y < p.y + 20 &&
          player.y + player.h > p.y
        ) {
          player.weapon = p.type;
          score += 50;
          powerups.splice(i, 1);
        }
      }

      // Update Enemies & Shooting AI
      enemies.forEach(e => {
        if (e.hp <= 0) return;

        e.shootTimer++;
        if (e.shootTimer > 120) { // Shoot every 2 seconds
          e.shootTimer = 0;
          const dx = player.x - e.x;
          const dy = player.y - e.y;
          const dist = Math.hypot(dx, dy);

          if (dist < 500) { // Shoot only if player is in range
            enemyBullets.push({
              x: e.x,
              y: e.y + 10,
              vx: (dx / dist) * 4,
              vy: (dy / dist) * 4
            });
          }
        }
      });

      // Update Enemy Bullets
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const eb = enemyBullets[i];
        eb.x += eb.vx;
        eb.y += eb.vy;

        // Hit Player
        if (
          player.invulnerable === 0 &&
          eb.x > player.x && eb.x < player.x + player.w &&
          eb.y > player.y && eb.y < player.y + player.h
        ) {
          player.hp--;
          player.invulnerable = 60; // 1 second invulnerability
          enemyBullets.splice(i, 1);
          createExplosion(player.x + player.w / 2, player.y + player.h / 2, '#ff0000', 15);

          if (player.hp <= 0) {
            gameOver = true;
          }
        }
      }

      // Particles Loop
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.life--;
        if (pt.life <= 0) particles.splice(i, 1);
      }

      // Fall off pit reset
      if (player.y > canvas.height + 50) {
        player.hp = 0;
        gameOver = true;
      }
    }

    // Main Rendering Function
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.translate(-cameraX, 0); // Apply camera panning

      // Draw Platforms
      ctx.fillStyle = '#3a3a50';
      platforms.forEach(p => {
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = '#555577';
        ctx.fillRect(p.x, p.y, p.w, 4); // Top highlight border
        ctx.fillStyle = '#3a3a50';
      });

      // Draw Flying Pods
      pods.forEach(pod => {
        if (pod.alive) {
          ctx.fillStyle = '#00ffff';
          ctx.fillRect(pod.x, pod.y, pod.w, pod.h);
          ctx.fillStyle = '#000';
          ctx.fillText('POD', pod.x + 4, pod.y + 13);
        }
      });

      // Draw Powerup Items
      powerups.forEach(p => {
        ctx.fillStyle = p.type === 'SPREAD' ? '#ff00ff' : '#00ff00';
        ctx.fillRect(p.x, p.y, 16, 16);
        ctx.fillStyle = '#000';
        ctx.fillText(p.type[0], p.x + 4, p.y + 12);
      });

      // Draw Enemies
      enemies.forEach(e => {
        if (e.hp > 0) {
          ctx.fillStyle = '#ff3333';
          ctx.fillRect(e.x, e.y, e.w, e.h);
          // Enemy Gun Visor
          ctx.fillStyle = '#ffff00';
          ctx.fillRect(e.x + (e.x > player.x ? 0 : 16), e.y + 8, 8, 4);
        }
      });

      // Draw Player
      if (player.hp > 0 && (player.invulnerable % 6 < 3)) {
        ctx.fillStyle = '#3388ff';
        ctx.fillRect(player.x, player.y, player.w, player.h);

        // Draw Player Gun Barrel Direction
        ctx.fillStyle = '#ffffff';
        let gunX = player.facing === 1 ? player.x + player.w : player.x - 8;
        let gunY = player.y + 14;

        if (player.aimY === -1) gunY -= 10;
        if (player.aimY === 1) gunY += 10;

        ctx.fillRect(gunX, gunY, 8, 4);
      }

      // Draw Player Bullets
      ctx.fillStyle = '#ffff00';
      playerBullets.forEach(b => ctx.fillRect(b.x - 2, b.y - 2, 5, 5));

      // Draw Enemy Bullets
      ctx.fillStyle = '#ff4444';
      enemyBullets.forEach(eb => ctx.fillRect(eb.x - 2, eb.y - 2, 6, 6));

      // Draw Particles
      particles.forEach(pt => {
        ctx.fillStyle = pt.color;
        ctx.fillRect(pt.x, pt.y, 3, 3);
      });

      ctx.restore(); // Restore Camera Coordinates

      // --- Draw Fixed HUD Elements ---
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 16px monospace';
      ctx.fillText(`HEALTH: ${'♥'.repeat(Math.max(0, player.hp))}`, 20, 30);
      ctx.fillText(`WEAPON: ${player.weapon}`, 20, 55);
      ctx.fillText(`SCORE: ${score}`, 650, 30);

      // Game Over Screen
      if (gameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ff2222';
        ctx.font = 'bold 36px monospace';
        ctx.fillText('GAME OVER', 310, 210);
        ctx.fillStyle = '#ffffff';
        ctx.font = '16px monospace';
        ctx.fillText('Refresh page to restart', 290, 250);
      }
    }

    // Game Loop
    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
